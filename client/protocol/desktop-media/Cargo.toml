[package]
name = "nightjar-desktop-media"
description = "Nightjar desktop SDL3/FFmpeg/PyroWave media decode, GPU presentation, streaming, input, USB and audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Forwarded from `nightjar-desktop` when building the demo-library driver binary/tests.
demo-library = []
# Test fixtures/helpers used by `nightjar-desktop` unit tests only (`[dev-dependencies]`).
test-support = []

[dependencies]
nightjar-desktop-config = { path = "../desktop-config" }
nightjar-core = { path = "../client" }
nightjar-policy = { path = "../policy" }
rubylight-native-api = { path = "../native-api" }
rubylight-protocol = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonora = "0.2"
directories = "6"
libloading = "0.8"
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }
rusb = { version = "0.9", features = ["vendored"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["use-pkg-config"] }
windows = { version = "0.62", features = ["Networking_Connectivity", "Win32_System_WinRT", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Wdk_Graphics_Direct3D", "Win32_Security", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Networking_WinHttp", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_DxMediaObjects", "Win32_UI_Shell_PropertiesSystem", "Win32_System_SystemInformation", "Win32_System_Shutdown", "Win32_System_Power", "Win32_Security_Authorization"] }
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["use-pkg-config"] }
system-configuration = "0.8"
objc2-app-kit = { version = "0.2", default-features = false, features = ["NSWorkspace"] }
objc2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["build-from-source-static"] }
zbus = { version = "5.19", default-features = false, features = ["tokio", "blocking-api"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[dev-dependencies]
nightjar-desktop-config = { path = "../desktop-config", features = ["test-lang"] }

[lints]
workspace = true
