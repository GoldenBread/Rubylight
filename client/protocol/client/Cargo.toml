[package]
name = "nightjar-core"
description = "Nightjar's client streaming engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nightjar-policy = { path = "../policy" }
rubylight-protocol = { path = "../core" }
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
# Shared patched rusty_enet (vendor/rusty_enet): Nightjar enables round_up_srtt and
# lenient_peer_address on HostSettings, while the host leaves both off by default.
rusty_enet = { version = "0.4", path = "../vendor/rusty_enet" }
# Host HTTP, pairing and encrypted RTSP. Pure Rust plus ring, so the same code builds for
# Android, Windows and Linux without OpenSSL.
rand_core = { version = "0.6", features = ["getrandom"] }
# Log redaction (report/redact.rs). No Unicode tables: the patterns use Java's ASCII classes.
regex = { version = "1", default-features = false, features = ["std", "perf"] }
ring = "0.17"
rsa = { version = "0.9", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Rubylight native API v1 types (library, session, Radeon, errors).
rubylight-native-api = { path = "../native-api" }
serde = "1"
serde_json = "1"
# Internet play: the rendezvous, hole punching and the tunnel, shared with the host.
rubylight-traverse = { path = "../traverse" }
# Receive buffer sizes on the media sockets.
socket2 = "0.5"

# SO_PRIORITY on the media sockets and nice values on the stream threads; poll on the control
# socket.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# priority.rs: the desktop portal's and RealtimeKit's thread raise when setpriority is refused;
# the features the desktop's zbus already has.
# UDP receive coalescing on the video socket (session/net.rs): WSARecvMsg and its options. The
# windows-sys the workspace already locks.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio", "blocking-api"] }

[lints]
workspace = true

[dev-dependencies]
# Shared wire codecs and crypto primitives (control, input, mic, RTSP, haptics, controller audio).
rubylight-wire = { path = "../wire" }
# Property tests over the host replies, control stream and USB/IP server (fuzz_tests.rs).
proptest = { version = "1", default-features = false, features = ["std"] }
# Receive-path golden tests (tests/golden): the host simulators encrypt.
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
