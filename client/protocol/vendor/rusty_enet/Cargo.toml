# rusty_enet 0.4.0 (MIT, https://github.com/jabuwu/rusty_enet), changed in these ways only. Shared
# by the Rubylight host (through `[patch.crates-io]` in the root Cargo.toml) and Nightjar (by path
# from protocol/client/Cargo.toml).
# - src/c/protocol.rs, the round trip smoothing in the acknowledgement handler (marked
#   "Nightjar", gated by `HostSettings::round_up_srtt`, off by default): five divisions round up
#   like moonlight-common-c's ENet fork, so the smoothed round trip time converges on the samples.
#   Variance decay: (v + 3) / 4 instead of v / 4. Variance step, both directions: (diff + 3) / 4
#   instead of diff / 4. Mean step, both directions: (diff + 7) / 8 instead of diff / 8.
# - src/c/protocol.rs, enet_protocol_handle_incoming_commands (marked "Nightjar", gated by
#   `HostSettings::lenient_peer_address`, off by default): skips the check that a datagram comes
#   from the peer's address, as in moonlight-common-c's ENet fork (cf38f85, "Be more lenient with
#   the expected peer address for multi-homed hosts"); the peer follows the source.
# - src/host.rs & src/peer.rs: `Host::next_service_in` / `Peer::next_service_time` and
#   `Peer::has_unsent_reliable` added (marked "Nightjar addition"), so the driver can keep input
#   merging in its own queue while the reliable window is full (nightjar#97).
# - Resend after a silence (marked "Rubylight", off unless `Peer::set_resend_after_silence` turns
#   it on): when a peer is heard from again after two ping intervals or more without a datagram,
#   src/c/protocol.rs (enet_protocol_resend_after_silence, called from
#   enet_protocol_handle_incoming_commands) lowers the backed-off retransmission timeouts of its
#   outstanding reliable commands to round trip time plus four variances, so they go out with the
#   next send instead of up to an outage later; once until the peer acknowledges something
#   (enet_protocol_handle_acknowledge). src/c/peer.rs adds the three peer fields, cleared on
#   reset; src/peer.rs the setter. The wire protocol is unchanged.
# - src/c/protocol.rs, enet_protocol_check_timeouts: the `1 << (send_attempts - 1)` disconnect
#   test saturates instead of overflowing past 32 attempts, which the resends can reach.
# - src/time.rs `monotonic_time` and src/host.rs: `HostSettings::default().time` is the monotonic
#   clock (Instant since the first call) instead of the wall clock, which an NTP adjustment or a
#   clock step moves backward and makes every reliable command look overdue.
# - src/lib.rs: `#![allow(warnings)]` added, the upstream lint output is not ours to fix.
# - src/lib.rs: the `mod test` declaration is dropped together with src/test and src/test.rs, and
#   the dev-dependencies (rand, rand_chacha) with them.
# - Cargo.toml: the generated header and the docs.rs and exclude metadata are dropped.
[package]
edition = "2021"
rust-version = "1.77"
name = "rusty_enet"
version = "0.4.0"
description = "ENet for Rust (and wasm!) transpiled from C."
readme = "README.md"
license = "MIT"
repository = "https://github.com/jabuwu/rusty_enet"

[features]
connected = []
default = ["std"]
std = []

[target."cfg(target_arch = \"wasm32\")".dependencies.js-sys]
version = "0.3.69"
