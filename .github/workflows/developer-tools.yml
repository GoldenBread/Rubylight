name: Developer workflow checks
on:
  push:
    branches: [main, 'wip/**']
    paths: ['rust/**', '!rust/**/*.md', 'client/**', '!client/**/*.md', '!client/docs/**', '!client/fastlane/**', '!client/store-assets/**', '!client/LICENSE.txt', 'tests/**', '!tests/**/*.md', 'tools/**', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'clippy.toml', '.config/nextest.toml', '.github/workflows/developer-tools.yml']
  pull_request:
    paths: ['rust/**', '!rust/**/*.md', 'client/**', '!client/**/*.md', '!client/docs/**', '!client/fastlane/**', '!client/store-assets/**', '!client/LICENSE.txt', 'tests/**', '!tests/**/*.md', 'tools/**', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'clippy.toml', '.config/nextest.toml', '.github/workflows/developer-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: developer-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements-test.txt
      - name: Run architecture checks
        run: |
          python tools/arch_check.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/code_map.py check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check workflow coordination without hardware
        run: |
          python -m unittest discover -s tools -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
