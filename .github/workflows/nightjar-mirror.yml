name: Nightjar mirror

# Publishes client/ to RamazanKara/nightjar (tools/mirror_nightjar.py, fast-forward only) once
# main's Nightjar CI passed, and starts the Nightjar release candidate there
# (client/.github/workflows/rc.yml). Rubylight and Nightjar share their version, so the RC gets
# the version Rubylight's RC of the same commit gets (rc.mjs plan). A push that changes only
# files CI skips (docs, notes, client/.github) is mirrored too; rc.yml builds no RC for it.
# Each run mirrors main as it is when the run starts, once the CI runs of its newest client
# changes passed, so an older run that waited adds nothing.
# The push and the dispatch use the rubylight-pretriage-bot app, which needs Contents and
# Workflows write on nightjar and bypasses nightjar main's owner-only ruleset.
# tools/mirror-nightjar.ps1 stays the manual way.

on:
  workflow_run:
    workflows: [Nightjar Android, Nightjar macOS]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['client/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightjar-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REMOTE: https://github.com/RamazanKara/nightjar.git
    steps:
      - id: head
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.head.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Mirror only when each Nightjar workflow passed on the newest commit its paths filter takes
      # (the pathspecs below repeat the filters). GitHub runs a push's last commit only, so the
      # run that tested that commit is the oldest one on a commit containing it. A run not
      # finished yet mirrors when it ends.
      - id: gate
        env:
          HEAD: ${{ steps.head.outputs.sha }}
        run: |
          check() { # workflow, pathspec...
            local workflow=$1; shift
            local need run="" sha status conclusion
            need=$(git log -1 --format=%H "$HEAD" -- "$@")
            [ -n "$need" ] || return 0
            while read -r sha status conclusion; do # newest first
              if git merge-base --is-ancestor "$need" "$sha" 2> /dev/null; then run="$status $conclusion"; fi
            done < <(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event push --limit 40 \
              --json headSha,status,conclusion --jq '.[] | "\(.headSha) \(.status) \(.conclusion)"')
            if [ "$run" != "completed success" ]; then
              echo "::notice::$workflow on ${need:0:10}: ${run:-no run yet}; nothing is mirrored until it passes"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          }
          check nightjar-android.yml client ':!client/*.md' ':!client/docs' ':!client/fastlane' ':!client/store-assets' \
            ':!client/LICENSE.txt' ':!client/.github' .github/workflows/nightjar-android.yml
          check nightjar-macos.yml client/protocol client/scripts client/app/build.gradle client/app/src/main/assets \
            client/app/src/main/res .github/workflows/nightjar-macos.yml
      - if: steps.gate.outputs.skip != 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.PRETRIAGE_CLIENT_ID }}
          private-key: ${{ secrets.PRETRIAGE_APP_KEY }}
          owner: RamazanKara
          repositories: nightjar
          permission-contents: write
          permission-workflows: write
      - if: steps.gate.outputs.skip != 'true'
        id: push
        env:
          HEAD: ${{ steps.head.outputs.sha }}
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$REMOTE.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          python3 tools/mirror_nightjar.py --remote "$REMOTE" --ref "$HEAD"
          echo "nightjar=$(git ls-remote "$REMOTE" refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      # Also after a run that pushed nothing: the dispatch of the run that pushed may have failed.
      # rc.yml skips an RC that exists or has no app changes.
      - if: steps.gate.outputs.skip != 'true'
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          RC_REPO: RamazanKara/nightjar
          HEAD: ${{ steps.head.outputs.sha }}
        run: node .github/scripts/rc.mjs plan "$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' client/app/build.gradle | head -n 1)" "$HEAD"
      - if: steps.gate.outputs.skip != 'true' && steps.plan.outputs.exists != 'true'
        name: Start the Nightjar release candidate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          NIGHTJAR: ${{ steps.push.outputs.nightjar }}
        run: |
          gh api repos/RamazanKara/nightjar/dispatches -f event_type=rc \
            -f "client_payload[version]=$VERSION" -f "client_payload[sha]=$NIGHTJAR" > /dev/null
          echo "::notice::nightjar rc.yml builds v$VERSION from $NIGHTJAR"
