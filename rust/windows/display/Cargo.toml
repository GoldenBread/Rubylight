[package]
name = "butterpollo-win-display"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
butterpollo-config = { path = "../../core/config" }
butterpollo-crypto = { path = "../../core/crypto" }
butterpollo-media-policy = { path = "../../core/media-policy" }
butterpollo-session = { path = "../../core/session" }
rubylight-vdisplay-proto = { path = "../../drivers/rubylight-vdisplay-proto" }
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Linux: this crate re-exports the Linux platform crate, so the host names one platform.
[target.'cfg(target_os = "linux")'.dependencies]
butterpollo-linux-display = { path = "../../linux/display" }

[lints]
workspace = true
