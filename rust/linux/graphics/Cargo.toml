[package]
name = "butterpollo-linux-graphics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
butterpollo-config = { path = "../../core/config" }
butterpollo-crypto = { path = "../../core/crypto" }
butterpollo-linux-io = { path = "../io" }
butterpollo-media-policy = { path = "../../core/media-policy" }
rubylight-protocol = { path = "../../../client/protocol/core" }
rubylight-vdisplay-proto = { path = "../../drivers/rubylight-vdisplay-proto" }
libloading = "0.8"
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }
libc = "0.2"
png = "0.18"
zune-jpeg = "0.5"
pipewire = "0.10"
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[features]
# FFmpeg only from beside the host, never the system's: the host's tests see the same host
# whatever FFmpeg the PC has.
test-ffmpeg = []

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[lints]
workspace = true
