# Probes for the Linux host spike (docs/linux-host-spike.md): capture and
# hardware encoding on Linux, measured before any host code depends on them.
# A workspace of its own with its own lock file, so the Windows host's
# dependencies and lock file stay as they are. Linux only; needs the libva,
# libpipewire and clang development files (see the document).
[package]
name = "butterpollo-linux-probes"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
repository = "https://github.com/RamazanKara/Rubylight"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
libc = "0.2"
pipewire = "0.10"

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
