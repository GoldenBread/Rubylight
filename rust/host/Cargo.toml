[package]
name = "butterpollo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
butterpollo-config = { path = "../core/config" }
butterpollo-media-policy = { path = "../core/media-policy" }
butterpollo-session = { path = "../core/session" }
butterpollo-win-display = { path = "../windows/display" }
butterpollo-win-graphics = { path = "../windows/graphics" }
butterpollo-win-io = { path = "../windows/io" }
butterpollo-stream = { path = "stream" }
butterpollo-webrtc = { path = "webrtc" }
butterpollo-web = { path = "web" }
tokio = { version = "1.48", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
time = "0.3"
uuid = { version = "1.18", features = ["v4"] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
butterpollo-stream = { path = "stream", features = ["test-support"] }
butterpollo-win-io = { path = "../windows/io", features = ["test-folder", "test-route"] }
rusty_enet = "0.4"

[lints]
workspace = true
