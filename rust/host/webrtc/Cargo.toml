[package]
name = "butterpollo-webrtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
butterpollo-config = { path = "../../core/config" }
butterpollo-crypto = { path = "../../core/crypto" }
butterpollo-media-policy = { path = "../../core/media-policy" }
butterpollo-input-policy = { path = "../../core/input-policy" }
butterpollo-session = { path = "../../core/session" }
butterpollo-win-graphics = { path = "../../windows/graphics" }
butterpollo-win-io = { path = "../../windows/io" }
butterpollo-stream = { path = "../stream" }
tokio = { version = "1.48", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
base64 = "0.22"
rand = "0.8"
socket2 = { version = "0.6", features = ["all"] }
# WebRTC media transport (Sans-IO), see docs/webrtc-design.md. Exact pin: H.265 and AV1 are hidden API.
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }

[features]
test-support = ["butterpollo-stream/test-support"]

[dev-dependencies]
butterpollo-stream = { path = "../stream", features = ["test-support"] }

[lints]
workspace = true
