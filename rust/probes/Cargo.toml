[dependencies]
anyhow.workspace = true
butterpollo-crypto = { path = "../core/crypto" }
butterpollo-config = { path = "../core/config" }
butterpollo-media-policy = { path = "../core/media-policy" }
butterpollo-input-policy = { path = "../core/input-policy" }
butterpollo-session = { path = "../core/session" }
rubylight-protocol = { path = "../../client/protocol/core" }
half = "2"
hex = "0.4"
libloading = "0.8"
serde_json.workspace = true
socket2 = "0.6"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
butterpollo-win-display = { path = "../windows/display" }
butterpollo-win-graphics = { path = "../windows/graphics" }
butterpollo-win-io = { path = "../windows/io" }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[lints]
workspace = true
