[package]
name = "butterpollo-probes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The diagnostic probes the package ships and the internal development probes.
# They are bins, not examples of core and windows: building examples brings
# every member's dev-dependencies into feature resolution, which rebuilt
# Windows crates with test-only features for the package.
[[bin]]
name = "butterpollo-performance"
path = "src/performance.rs"
test = false

